<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscador de Fallas — Flota Navimag</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --surface: #f7f8fa;
    --surface2: #eef0f4;
    --border: #e2e5eb;
    --text: #1a1d23;
    --muted: #6b7280;
    --muted2: #9aa1ad;

    --c-kalmar: #005b99;    --c-kalmar-light: #e8f2fa;
    --c-dana: #b84700;      --c-dana-light: #fff0e8;
    --c-g30: #1a7f4b;       --c-g30-light: #e8f5ee;
    --c-d8: #6d28d9;        --c-d8-light: #f2ecfc;

    --green: #1a7f4b; --green-light: #e8f5ee;
    --amber: #92610a; --amber-light: #fdf3e0;
    --red: #b91c1c;   --red-light: #fef2f2;
    --blue: #1d4ed8;  --blue-light: #eff6ff;
  }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.5;
  }

  /* ---------- HEADER ---------- */
  .header {
    background: var(--text);
    color: white;
    padding: 20px 24px 0;
    position: sticky; top: 0; z-index: 40;
  }
  .header-top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
  .header-icon {
    width: 42px; height: 42px; background: white; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0;
  }
  .header-title { font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
  .header-sub { font-size: 12px; color: #94a3b8; margin-top: 2px; font-family: 'IBM Plex Mono', monospace; }
  .header-stats { margin-left: auto; display:flex; gap:16px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:#94a3b8; }
  .header-stats b { color:#e2e8f0; font-size:14px; display:block; font-family:'IBM Plex Sans',sans-serif;}

  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab {
    padding: 10px 16px; font-size: 13px; font-weight: 500; border: none; background: transparent;
    color: #94a3b8; cursor: pointer; border-radius: 6px 6px 0 0; transition: all .15s; font-family: inherit;
    display:flex; align-items:center; gap:7px;
  }
  .tab:hover { background: rgba(255,255,255,.06); color: #cbd5e1; }
  .tab.active { background: var(--bg); color: var(--text); }
  .tab .dot { width:8px; height:8px; border-radius:50%; }
  .tab .count { font-family:'IBM Plex Mono',monospace; font-size:11px; opacity:.7; }

  /* ---------- TOOLBAR ---------- */
  .toolbar {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 16px 24px; display: flex; flex-direction: column; gap: 12px;
    position: sticky; top: 90px; z-index: 30;
  }
  .search-row { display:flex; gap:10px; flex-wrap: wrap; }
  .search-box {
    flex: 1 1 320px; position: relative;
  }
  .search-box input {
    width: 100%; padding: 11px 14px 11px 38px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; font-family: inherit; background: white; color: var(--text);
  }
  .search-box input:focus { outline: 2px solid #94a3b8; outline-offset: -1px; }
  .search-box::before {
    content: "⌕"; position:absolute; left:12px; top:50%; transform:translateY(-50%);
    color: var(--muted2); font-size: 18px; font-weight:bold;
  }
  .btn {
    padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); background: white;
    font-family: inherit; font-size: 13px; font-weight: 500; color: var(--text); cursor: pointer;
    display:flex; align-items:center; gap:6px; transition: all .12s;
  }
  .btn:hover { background: var(--surface2); }
  .btn.active { background: var(--text); color: white; border-color: var(--text); }
  .btn.ghost { border-color: transparent; color: var(--muted); }
  .btn.small { padding: 6px 10px; font-size: 12px; }

  .filter-row { display:flex; gap:10px; flex-wrap: wrap; align-items:center; }
  .filter-row select {
    padding: 8px 10px; border-radius: 7px; border: 1px solid var(--border); background: white;
    font-family: inherit; font-size: 13px; color: var(--text); max-width: 260px;
  }
  .filter-label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
  .filter-clear { font-size: 12px; color: var(--blue); cursor: pointer; text-decoration: underline; background:none; border:none; font-family: inherit; }

  /* ---------- RESULTS ---------- */
  .container { max-width: 1100px; margin: 0 auto; padding: 20px 24px 80px; }
  .results-meta { font-size: 13px; color: var(--muted); margin-bottom: 14px; display:flex; justify-content:space-between; align-items:center; }
  .results-meta b { color: var(--text); }

  .card {
    border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; background: white;
    overflow: hidden; transition: box-shadow .15s;
  }
  .card:hover { box-shadow: 0 2px 10px rgba(0,0,0,.05); }
  .card-head {
    padding: 14px 16px; display: flex; align-items: flex-start; gap: 12px; cursor: pointer;
  }
  .badge {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; padding: 4px 9px;
    border-radius: 6px; white-space: nowrap; flex-shrink: 0; margin-top: 1px;
  }
  .src-kalmar { background: var(--c-kalmar-light); color: var(--c-kalmar); }
  .src-dana { background: var(--c-dana-light); color: var(--c-dana); }
  .src-grupo30 { background: var(--c-g30-light); color: var(--c-g30); }
  .src-d8evc { background: var(--c-d8-light); color: var(--c-d8); }

  .card-body-top { flex: 1; min-width: 0; }
  .card-code { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .card-title { font-size: 14.5px; font-weight: 500; color: var(--text); }
  .card-meta { display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 5px; background: var(--surface2); color: var(--muted); font-family:'IBM Plex Mono',monospace;}
  .card-chevron { color: var(--muted2); font-size: 13px; margin-top: 3px; transition: transform .15s; flex-shrink:0; }
  .card.open .card-chevron { transform: rotate(90deg); }

  .card-detail { display:none; border-top: 1px solid var(--border); padding: 16px; background: var(--surface); }
  .card.open .card-detail { display: block; }
  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  .field-label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .field-value { font-size: 13.5px; color: var(--text); white-space: pre-line; }
  .field-value.accion { background: var(--green-light); border-left: 3px solid var(--green); padding: 8px 10px; border-radius: 4px; }
  .field-value.causa { background: var(--amber-light); border-left: 3px solid var(--amber); padding: 8px 10px; border-radius: 4px; }

  .note-box { margin-top: 14px; border-top: 1px dashed var(--border); padding-top: 12px; }
  .note-box textarea {
    width: 100%; min-height: 60px; border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px;
    font-family: inherit; font-size: 13px; resize: vertical; color: var(--text);
  }
  .note-box textarea:focus { outline: 2px solid #94a3b8; outline-offset: -1px; }
  .note-actions { display:flex; justify-content: space-between; align-items:center; margin-top:6px; }
  .note-status { font-size:11px; color: var(--muted2); }

  .empty { text-align:center; padding: 60px 20px; color: var(--muted); }
  .empty-icon { font-size: 34px; margin-bottom: 10px; }

  /* ---------- HISTORY VIEW ---------- */
  .history-item {
    display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--border);
    border-radius: 9px; margin-bottom: 8px; cursor:pointer; background:white;
  }
  .history-item:hover { background: var(--surface); }
  .history-time { font-size: 11px; color: var(--muted2); font-family:'IBM Plex Mono',monospace; margin-left:auto; white-space:nowrap; }

  @media (max-width: 640px) {
    .header { padding: 14px 14px 0; }
    .toolbar { padding: 12px 14px; top: 78px; }
    .container { padding: 16px 14px 60px; }
    .header-stats { display:none; }
  }
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <div class="header-icon">🔧</div>
    <div>
      <div class="header-title">BUSCADOR DE FALLAS — FLOTA NAVIMAG</div>
      <div class="header-sub">Kalmar TR618i · Dana APC200 · TAD650-760VE (Grupo 30) · TAD870-873VE (D8 EVC-E3)</div>

  <div class="tabs" id="sourceTabs"></div>

    </div>
    <div>
      <div class="filter-label">Componente / sistema</div>
      <select id="filterComponente"><option value="">Todos</option></select>
    </div>
    <div>
      <div class="filter-label">Solo con nota</div>
      <select id="filterNota">
        <option value="">Todos</option>
        <option value="si">Con nota guardada</option>
      </select>
    </div>
    <button class="filter-clear" id="clearFiltersBtn">Limpiar filtros</button>
  </div>
</div>

<div class="container">
  <div id="mainView">
    <div class="results-meta">
      <div><b id="resultsCount">0</b> resultados</div>
    </div>
    <div id="resultsList"></div>
  </div>

  <div id="historyView" style="display:none;">
    <div class="results-meta"><b>Historial de consultas recientes</b></div>
    <div id="historyList"></div>
  </div>
</div>

<script>
const SOURCES = [
  { key: 'all',     label: 'Todos',                         cls: '' },
  { key: 'kalmar',  label: 'Kalmar TR618i',                 cls: 'src-kalmar' },
  { key: 'dana',    label: 'Dana APC200',                   cls: 'src-dana' },
  { key: 'grupo30', label: 'TAD650-760VE (Grupo 30)',       cls: 'src-grupo30' },
  { key: 'd8evc',   label: 'TAD870-873VE (D8 EVC-E3)',      cls: 'src-d8evc' },
];
const SRC_SHORT = { kalmar:'KALMAR', dana:'DANA', grupo30:'GRUPO 30', d8evc:'D8 EVC-E3' };

let state = {
  source: 'all',
  query: '',
  tipo: '',
  componente: '',
  nota: '',
  view: 'main',
  openIds: new Set(),
};
let notesObj = {};
let historyArr = [];
let saveTimers = {};

// ---------- Persistence ----------
async function loadStorage() {
  try {
    const r = await window.storage.get('notes');
    notesObj = r && r.value ? JSON.parse(r.value) : {};
  } catch (e) { notesObj = {}; }
  try {
    const r = await window.storage.get('history');
    historyArr = r && r.value ? JSON.parse(r.value) : [];
  } catch (e) { historyArr = []; }
  updateStats();
}

let storageOk = true;
let storageWarned = false;

function showStorageWarning() {
  if (storageWarned) return;
  storageWarned = true;
  const bar = document.createElement('div');
  bar.style.cssText = 'background:#fdf3e0;color:#92610a;font-size:12.5px;padding:9px 22px;text-align:center;border-bottom:1px solid #e8d5a8;';
  bar.textContent = '⚠ No se pudo conectar el guardado automático de notas/historial en este momento. Puedes seguir usando el buscador con normalidad, pero las notas podrían no guardarse entre sesiones.';
  document.body.insertBefore(bar, document.body.firstChild);
}

async function saveNotes(retry) {
  if (!storageOk) return;
  try { await window.storage.set('notes', JSON.stringify(notesObj)); storageOk = true; }
  catch (e) {
    if (!retry) { setTimeout(() => saveNotes(true), 800); return; }
    storageOk = false; showStorageWarning();
  }
}

async function saveHistory(retry) {
  if (!storageOk) return;
  try { await window.storage.set('history', JSON.stringify(historyArr)); storageOk = true; }
  catch (e) {
    if (!retry) { setTimeout(() => saveHistory(true), 800); return; }
    storageOk = false; showStorageWarning();
  }
}

function pushHistory(item) {
  historyArr = historyArr.filter(h => h.id !== item.id);
  historyArr.unshift({ ...item, ts: Date.now() });
  if (historyArr.length > 60) historyArr = historyArr.slice(0, 60);
  saveHistory();
  if (state.view === 'history') renderHistory();
}

function updateStats() {
  document.getElementById('statTotal').textContent = FAULT_DATA.length;
  document.getElementById('statNotes').textContent = Object.keys(notesObj).filter(k => notesObj[k] && notesObj[k].trim()).length;
}

// ---------- Rendering: tabs ----------
function renderTabs() {
  const el = document.getElementById('sourceTabs');
  el.innerHTML = SOURCES.map(s => {
    const count = s.key === 'all' ? FAULT_DATA.length : FAULT_DATA.filter(d => d.fuente === s.key).length;
    const dotColor = s.key === 'all' ? '#94a3b8' : getComputedColor(s.cls);
    return `<button class="tab ${state.source===s.key && state.view==='main' ? 'active':''}" data-src="${s.key}">
      ${s.key!=='all' ? `<span class="dot" style="background:${dotColor}"></span>` : ''}
      ${s.label} <span class="count">${count}</span>
    </button>`;
  }).join('');
}
function getComputedColor(cls) {
  const map = { 'src-kalmar':'#005b99', 'src-dana':'#b84700', 'src-grupo30':'#1a7f4b', 'src-d8evc':'#6d28d9' };
  return map[cls] || '#94a3b8';
}

// ---------- Filter options ----------
function populateFilterOptions() {
  const pool = state.source === 'all' ? FAULT_DATA : FAULT_DATA.filter(d => d.fuente === state.source);
  const tipos = [...new Set(pool.map(d => d.tipo).filter(Boolean))].sort();
  const comps = [...new Set(pool.map(d => d.componente).filter(Boolean))].sort();

  const tipoSel = document.getElementById('filterTipo');
  const curTipo = state.tipo;
  tipoSel.innerHTML = '<option value="">Todos</option>' + tipos.map(t => `<option value="${escAttr(t)}">${esc(t)}</option>`).join('');
  if (tipos.includes(curTipo)) tipoSel.value = curTipo; else { state.tipo = ''; tipoSel.value=''; }

  const compSel = document.getElementById('filterComponente');
  const curComp = state.componente;
  compSel.innerHTML = '<option value="">Todos</option>' + comps.map(c => `<option value="${escAttr(c)}">${esc(truncate(c,50))}</option>`).join('');
  if (comps.includes(curComp)) compSel.value = curComp; else { state.componente = ''; compSel.value=''; }
}

// ---------- Filtering ----------
function getFiltered() {
  let pool = state.source === 'all' ? FAULT_DATA : FAULT_DATA.filter(d => d.fuente === state.source);
  if (state.tipo) pool = pool.filter(d => d.tipo === state.tipo);
  if (state.componente) pool = pool.filter(d => d.componente === state.componente);
  if (state.nota === 'si') pool = pool.filter(d => notesObj[d.id] && notesObj[d.id].trim());
  if (state.query.trim()) {
    const q = state.query.trim().toLowerCase();
    const terms = q.split(/\s+/).filter(Boolean);
    pool = pool.filter(d => terms.every(t => d.search.includes(t)));
  }
  return pool;
}

// ---------- Rendering: results ----------
function renderResults() {
  const list = getFiltered();
  document.getElementById('resultsCount').textContent = list.length;
  const container = document.getElementById('resultsList');

  if (list.length === 0) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div>Sin resultados. Prueba con otro término o quita filtros.</div>`;
    return;
  }

  container.innerHTML = list.map(d => cardHTML(d)).join('');
}

function cardHTML(d) {
  const isOpen = state.openIds.has(d.id);
  const q = state.query.trim();
  const note = notesObj[d.id] || '';
  return `
  <div class="card ${isOpen?'open':''}" data-id="${d.id}">
    <div class="card-head" data-toggle="${d.id}">
      <span class="badge ${'src-'+d.fuente}">${SRC_SHORT[d.fuente]}</span>
      <div class="card-body-top">
        <div class="card-code">${esc(d.codigo)}</div>
        <div class="card-title">${highlight(d.titulo, q)}</div>
        <div class="card-meta">
          ${d.tipo ? `<span class="chip">${esc(d.tipo)}</span>` : ''}
          ${d.componente ? `<span class="chip">${esc(truncate(d.componente,40))}</span>` : ''}
          ${note.trim() ? `<span class="chip" style="background:var(--amber-light);color:var(--amber)">📝 nota</span>` : ''}
        </div>
      </div>
      <div class="card-chevron">▶</div>
    </div>
    <div class="card-detail">
      ${isOpen ? detailHTML(d, note) : ''}
    </div>
  </div>`;
}

function detailHTML(d, note) {
  const fieldsHtml = d.fields.filter(f => f.value && f.value.trim()).map(f => {
    let cls = '';
    if (/acci[oó]n/i.test(f.label)) cls = 'accion';
    if (/causa|raz[oó]n/i.test(f.label)) cls = 'causa';
    return `<div class="field">
      <div class="field-label">${esc(f.label)}</div>
      <div class="field-value ${cls}">${esc(f.value)}</div>
    </div>`;
  }).join('');

  return `
    ${fieldsHtml}
    <div class="note-box">
      <div class="field-label">📝 Nota personal (se guarda automáticamente)</div>
      <textarea data-note="${d.id}" placeholder="Ej: revisado en Terberg RT223 patente XX-1234, se cambió sensor...">${esc(note)}</textarea>
      <div class="note-actions">
        <span class="note-status" data-status="${d.id}"></span>
        <button class="btn small ghost" data-clearnote="${d.id}">Borrar nota</button>
      </div>
    </div>
  `;
}

// ---------- History view ----------
function renderHistory() {
  const el = document.getElementById('historyList');
  if (historyArr.length === 0) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">🕘</div>Todavía no hay historial. Los códigos que abras aparecerán aquí.</div>`;
    return;
  }
  el.innerHTML = historyArr.map(h => `
    <div class="history-item" data-gotoid="${h.id}">
      <span class="badge ${'src-'+h.fuente}">${SRC_SHORT[h.fuente]}</span>
      <div>
        <div class="card-code" style="margin-bottom:2px">${esc(h.codigo)}</div>
        <div style="font-size:13px">${esc(h.titulo)}</div>
      </div>
      <div class="history-time">${timeAgo(h.ts)}</div>
    </div>
  `).join('');
}

function timeAgo(ts) {
  const s = Math.floor((Date.now()-ts)/1000);
  if (s < 60) return 'hace un momento';
  if (s < 3600) return `hace ${Math.floor(s/60)} min`;
  if (s < 86400) return `hace ${Math.floor(s/3600)} h`;
  const d = new Date(ts);
  return d.toLocaleDateString('es-CL', {day:'2-digit',month:'2-digit',year:'2-digit'});
}

// ---------- Helpers ----------
function esc(s) { return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s) { return esc(s); }
function truncate(s, n) { return s.length > n ? s.slice(0,n)+'…' : s; }
function highlight(text, q) {
  const t = esc(text);
  if (!q) return t;
  try {
    const terms = q.trim().split(/\s+/).map(w => w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
    const re = new RegExp('(' + terms.join('|') + ')', 'gi');
    return t.replace(re, '<mark style="background:#fde68a;padding:0 1px;border-radius:2px;">$1</mark>');
  } catch(e) { return t; }
}

// ---------- Events ----------
function bindEvents() {
  document.getElementById('sourceTabs').addEventListener('click', e => {
    const btn = e.target.closest('[data-src]');
    if (!btn) return;
    state.source = btn.dataset.src;
    state.view = 'main';
    state.tipo = ''; state.componente = '';
    switchView();
    populateFilterOptions();
    renderTabs();
    renderResults();
  });

  document.getElementById('searchInput').addEventListener('input', e => {
    state.query = e.target.value;
    renderResults();
  });

  document.getElementById('advToggleBtn').addEventListener('click', () => {
    const el = document.getElementById('advFilters');
    el.style.display = el.style.display === 'none' ? 'flex' : 'none';
  });

  document.getElementById('filterTipo').addEventListener('change', e => { state.tipo = e.target.value; renderResults(); });
  document.getElementById('filterComponente').addEventListener('change', e => { state.componente = e.target.value; renderResults(); });
  document.getElementById('filterNota').addEventListener('change', e => { state.nota = e.target.value; renderResults(); });
  document.getElementById('clearFiltersBtn').addEventListener('click', () => {
    state.tipo=''; state.componente=''; state.nota='';
    document.getElementById('filterTipo').value='';
    document.getElementById('filterComponente').value='';
    document.getElementById('filterNota').value='';
    renderResults();
  });

  document.getElementById('historyBtn').addEventListener('click', () => {
    state.view = state.view === 'history' ? 'main' : 'history';
    switchView();
  });

  document.getElementById('resultsList').addEventListener('click', e => {
    const noteClear = e.target.closest('[data-clearnote]');
    if (noteClear) {
      const id = noteClear.dataset.clearnote;
      notesObj[id] = '';
      saveNotes(); updateStats();
      const ta = document.querySelector(`textarea[data-note="${cssEsc(id)}"]`);
      if (ta) ta.value = '';
      setNoteStatus(id, 'Nota borrada');
      renderResults();
      return;
    }
    const toggle = e.target.closest('[data-toggle]');
    if (toggle) {
      const id = toggle.dataset.toggle;
      const d = FAULT_DATA.find(x => x.id === id);
      if (state.openIds.has(id)) {
        state.openIds.delete(id);
      } else {
        state.openIds.add(id);
        pushHistory({ id: d.id, codigo: d.codigo, titulo: d.titulo, fuente: d.fuente });
      }
      renderResults();
    }
  });

  document.getElementById('resultsList').addEventListener('input', e => {
    const ta = e.target.closest('[data-note]');
    if (!ta) return;
    const id = ta.dataset.note;
    notesObj[id] = ta.value;
    setNoteStatus(id, 'Guardando…');
    clearTimeout(saveTimers[id]);
    saveTimers[id] = setTimeout(async () => {
      await saveNotes();
      updateStats();
      setNoteStatus(id, 'Guardado ✓');
    }, 600);
  });

  document.getElementById('historyList').addEventListener('click', e => {
    const item = e.target.closest('[data-gotoid]');
    if (!item) return;
    const id = item.dataset.gotoid;
    const d = FAULT_DATA.find(x => x.id === id);
    if (!d) return;
    state.source = d.fuente;
    state.view = 'main';
    state.query = ''; state.tipo=''; state.componente='';
    document.getElementById('searchInput').value = '';
    state.openIds.add(id);
    switchView();
    populateFilterOptions();
    renderTabs();
    renderResults();
    setTimeout(() => {
      const card = document.querySelector(`.card[data-id="${cssEsc(id)}"]`);
      if (card) card.scrollIntoView({behavior:'smooth', block:'center'});
    }, 50);
  });
}

function cssEsc(s) { return s.replace(/[^a-zA-Z0-9_-]/g, '\\$&'); }

function setNoteStatus(id, msg) {
  const el = document.querySelector(`[data-status="${cssEsc(id)}"]`);
  if (el) { el.textContent = msg; }
}

function switchView() {
  document.getElementById('mainView').style.display = state.view === 'main' ? 'block' : 'none';
  document.getElementById('historyView').style.display = state.view === 'history' ? 'block' : 'none';
  document.getElementById('historyBtn').classList.toggle('active', state.view === 'history');
  if (state.view === 'history') renderHistory();
}

// ---------- Init ----------
(async function init() {
  await loadStorage();
  renderTabs();
  populateFilterOptions();
  renderResults();
  bindEvents();
})();
</script>
</body>
</html>
